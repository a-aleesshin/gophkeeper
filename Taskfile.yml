# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  ENV: '{{.ENV | default "local"}}'
  COMPOSE_FILE: 'docker/{{.ENV}}/docker-compose.yaml'
  COMPOSE_PROJECT_NAME: 'gophkeeper_{{.ENV}}'

dotenv: ['docker/{{.ENV}}/.env']

tasks:
  db-up:
    desc: Start database
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT_NAME}} -f {{.COMPOSE_FILE}} up -d db
    silent: true

  db-down:
    desc: Stop the local database container
    cmds:
      - docker compose -p {{.COMPOSE_PROJECT_NAME}} -f {{.COMPOSE_FILE}} down db --remove-orphans
    silent: true

  proto:
    desc: Generate Go code from proto files
    cmds:
      - protoc -I api/proto --go_out=api/proto --go_opt=paths=source_relative --go-grpc_out=api/proto --go-grpc_opt=paths=source_relative api/proto/gophkeeper/v1/*.proto

  build-client:
    desc: Build client for current platform (VERSION=1.0.0)
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}} -X main.buildDate={{.DATE}}" -o bin/gophkeeper ./cmd/client

  release-client:
    desc: Cross-compile client for Windows, Linux and macOS (VERSION=1.0.0)
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
      LDFLAGS: '-X main.version={{.VERSION}} -X main.buildDate={{.DATE}}'
    cmds:
      - GOOS=linux   GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o bin/gophkeeper-linux-amd64 ./cmd/client
      - GOOS=darwin  GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o bin/gophkeeper-darwin-amd64 ./cmd/client
      - GOOS=darwin  GOARCH=arm64 go build -ldflags "{{.LDFLAGS}}" -o bin/gophkeeper-darwin-arm64 ./cmd/client
      - GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o bin/gophkeeper-windows-amd64.exe ./cmd/client

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Format check, vet and tests
    cmds:
      - test -z "$(gofmt -l internal cmd migrations)"
      - go vet ./...
      - go test ./...

  migrate:
    desc: Apply migrations (uses DATABASE_DSN from docker/{{.ENV}}/.env)
    cmds:
      - go run ./cmd/server migrate

  run:
    desc: Run the service locally
    cmds:
      - go run ./cmd/server

  image:
    desc: Build docker image (VERSION=1.0.0)
    vars:
      VERSION: '{{.VERSION | default "dev"}}'
    cmds:
      - docker build --build-arg APP_VERSION={{.VERSION}} -t gophkeeper:{{.VERSION}} .

  deploy-migrate:
    desc: Run migrations in prod compose (ENV=prod)
    cmds:
      - docker compose -p gophkeeper_{{.ENV}} -f {{.COMPOSE_FILE}} --profile tools run --rm migrate

  deploy-up:
    desc: Start the service in prod compose (ENV=prod)
    cmds:
      - docker compose -p gophkeeper_{{.ENV}} -f {{.COMPOSE_FILE}} up -d app

  deploy-down:
    desc: Stop the service in prod compose (ENV=prod)
    cmds:
      - docker compose -p gophkeeper_{{.ENV}} -f {{.COMPOSE_FILE}} down --remove-orphans

  deploy-logs:
    desc: Tail service logs (ENV=prod)
    cmds:
      - docker compose -p gophkeeper_{{.ENV}} -f {{.COMPOSE_FILE}} logs -f --tail=200 app