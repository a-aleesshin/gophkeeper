syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/a-aleesshin/gophkeeper/api/proto/gophkeeper/v1;gophkeeperv1";

service IdentityService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string login = 1;
  string password = 2;
}

message RegisterResponse {
  string user_id = 1;
}
